<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Vesper</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="panel" id="panel">
      <!-- Header: draggable. The star's liveness IS the connection state. -->
      <header class="header" data-tauri-drag-region>
        <span class="star" id="star" aria-hidden="true"></span>
        <span class="wordmark">VESPER</span>
        <span class="clock" id="clock">--:--</span>
      </header>

      <!-- Stream: Vesper's actual life — voice lines, plan traces, gold
           call-outs, briefings, confirmation cards. Newest at the bottom. -->
      <main class="stream" id="stream" aria-live="polite"></main>

      <!-- Light command input: SHORT commands and confirmations only. The HUD
           is display-first, not a chat window. -->
      <form class="composer" id="composer" autocomplete="off">
        <input
          class="composer-input"
          id="input"
          type="text"
          placeholder="…"
          spellcheck="false"
          autocomplete="off"
        />
      </form>
    </div>
  </body>
</html>
