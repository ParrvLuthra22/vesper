# =============================================================================
# Briefing engine — collectors, scorer, cache, builder. See docs/BRIEFING.md.
# Everything here is deterministic: no LLM is involved in scoring or selection.
# Override the file path with VESPER_BRIEFING_CONFIG. Missing keys fall back to the
# defaults in briefing/config.py (which mirror this file).
# =============================================================================

refresh:
  interval_minutes: 10          # how often the background collectors run
  jitter_fraction: 0.2          # +/- randomness on that interval (0.2 => 8-12 min), so runs don't sync up
  max_cache_age_minutes: 30     # get_daily_briefing refreshes SYNCHRONOUSLY only if a source is older than this
  collector_timeout_seconds: 45 # one collector hanging never blocks the others
  enabled: true                 # false: no background timer (the tool still reads/refreshes on demand)

collect:
  gmail_lookback_days: 3        # first run only: how far back to look for unread mail
  gmail_max_new: 50             # newest unread messages pulled per run
  snippet_chars: 200            # snippets are truncated to this at collection time (further at briefing time)
  calendar_window_days: 2       # today + tomorrow
  # Known correspondents are derived from your SENT mail (header addresses only, never bodies).
  # 365 not 60: measured on the real account, 60 days of sent mail was EMPTY (it sends ~1 mail a
  # fortnight; 12 in 180 days, 29 in 365), so a 60-day window boosted nobody. Lower it if you write a lot.
  sent_days: 365
  sent_max_messages: 500        # at most this many recent sent messages are read (headers only)
  sent_refresh_hours: 24        # re-read the sent-mail summary at most this often
  cache_path: "data/briefing.db"          # git-ignored
  rules_path: "data/briefing_rules.json"  # your --mark feedback; git-ignored, plain JSON

# People who matter. Matching is case-insensitive. EMPTY by default — fill it in.
vips:
  addresses: []                 # e.g. ["priya@example.com"]
  domains: []                   # e.g. ["newtonschool.co"]  (whole domain)
  names: []                     # substring of the display name, e.g. ["Priya"]

# Domains of mailbox providers (gmail.com, outlook.com ...). Having written to someone@gmail.com
# must not make every Gmail sender "known", so these never count as a known DOMAIN.
known:
  public_domains: [gmail.com, googlemail.com, outlook.com, hotmail.com, live.com, msn.com, yahoo.com, yahoo.in,
                   yahoo.co.in, icloud.com, me.com, mac.com, aol.com, proton.me, protonmail.com, gmx.com,
                   mail.com, zoho.com, rediffmail.com]

# Automated senders that MATTER. Mail from these has its noreply / newsletter / promo / mailing-list /
# auto-submitted penalties WAIVED (the urgency words below then apply). Off by default — uncomment what
# applies to you, or (better) put your own in config/briefing.local.yaml, which is git-ignored.
important_automated:
  domains: []
  #  - github.com            # PR reviews, CI failures, security alerts
  #  - vercel.com            # failed deploys
  #  - stripe.com            # payment failed / disputes
  #  - razorpay.com
  #  - paypal.com
  #  - devpost.com           # hackathon platforms: submission / judging deadlines
  #  - mlh.io
  #  - devfolio.co
  #  - unstop.com
  patterns: []                # regexes matched against the sender address and the subject
  #  - '\.edu$'               # college portals (this is broad: every notice from the college)
  #  - '\.ac\.in$'
  #  - 'placement|internship portal'

# Weights add up per item, then are clamped to 0..100 (mail to 0..mail_max_score).
weights:
  # ---- mail: base and sender importance ----
  mail_base: 15                 # every unread inbox message starts here
  personal_mail: 15             # NO bulk/automated signal at all: reads like a person wrote it to you
  vip_sender: 45                # sender is on the VIP list above
  known_correspondent: 25       # I have sent mail to this exact address within sent_days (derived, automatic)
  known_domain: 10              # I have sent mail to someone at this (non-public) domain
  important_automated: 0        # extra points for an ALLOWLISTED automated sender (important_automated below). 0 = the allowlist
                                # only waives penalties, so a plain notice scores ~15-25 and surfaces only when fresh, urgent or
                                # from a known domain. Set 15-20 to make allowlisted senders always reach the priority list.
  rule_priority: 40             # your `--mark ... priority` rule (also waives the bulk penalties)
  rule_ignore: -60              # your `--mark ... ignore` rule
  reply_in_my_thread: 20        # the thread contains a message I sent (someone answered me)
  is_reply: 5                   # it is a reply (Re: / In-Reply-To), whoever started the thread
  # ---- mail: age ----
  fresh_bonus: 10               # received within fresh_hours
  fresh_hours: 24
  stale_penalty: -10            # still unread after stale_days
  stale_days: 7
  # ---- mail: urgency words (per-word weights are in urgency_keywords below) ----
  urgency_total_cap: 30         # all keyword hits together can add at most this
  # ---- negative signals ----
  strong_urgency_bulk_cap: -10  # a strong-urgency match (list below) caps the COMBINED bulk penalties at this
  noreply_sender: -25           # noreply@ / do-not-reply@ and friends
  newsletter_signal: -25        # newsletter/digest wording, or Gmail Updates/Forums category
  promo_signal: -30             # promo wording, or Gmail Promotions/Social category
  mailing_list_header: -20      # List-Id, List-Unsubscribe or Precedence: bulk/list/junk
  auto_submitted: -15           # Auto-Submitted: auto-generated / auto-replied
  injection_suspected: -40      # text reads like instructions to an AI (snippet is also withheld)
  mail_max_score: 94            # mail can never outrank an imminent meeting (which is 100)
  # ---- calendar ----
  meeting_imminent: 100         # starts within imminent_hours, or is in progress — always top
  imminent_hours: 3
  meeting_today_later: 60       # later today, beyond the imminent window
  meeting_tomorrow: 45          # tomorrow
  meeting_keyword_bonus: 10     # title contains one of meeting_keywords
  all_day_event: -30            # all-day items (birthdays, holidays) are never "imminent"; they sit lower

# Words that raise a mail item's score (matched as whole words in subject + snippet,
# each counted once). Ignored for bulk mail ("URGENT: 50% off!" earns nothing).
urgency_keywords:
  urgent: 12
  asap: 12
  eod: 10
  deadline: 20                  # the STRONG terms (listed again below) weigh more: with the bulk-penalty
  due: 8                        # cap they must be enough, on their own, to surface a notice from a
  interview: 25                 # no-reply sender even when it is a day or two old
  offer: 12
  exam: 12
  tomorrow: 6
  evaluation: 15
  shortlisted: 25
  submission: 15
  expires: 10
  payment failed: 25
  action required: 20

# Strong urgency: if the subject or snippet contains one of these, the combined bulk penalties
# (noreply + newsletter + promo + list header + auto) are capped at weights.strong_urgency_bulk_cap,
# and the urgency words apply even though the mail is automated. A deadline notice from a
# no-reply portal should not score 0.
strong_urgency: [deadline, evaluation, shortlisted, submission, interview, payment failed, action required, expires]
# ...except these when the mail ALSO reads like a promotion ("coupon expires tonight").
strong_urgency_ignored_for_promo: [expires]
# Gmail's own Promotions/Social category beats a keyword: such mail never gets the cap. (Measured on the real
# inbox: its only "action required" item was a Gmail-Promotions mail with an unsubscribe header.)
strong_urgency_respects_gmail_promotions: true

meeting_keywords: [interview, exam, offer, deadline, review, demo, presentation]

# Pattern lists for the negative signals (case-insensitive regexes).
patterns:
  noreply_sender: ['no[-_.]?reply', 'do[-_.]?not[-_.]?reply', 'donotreply', 'mailer-daemon', 'postmaster']
  newsletter: ['newsletter', 'weekly digest', 'daily digest', 'monthly digest', 'round-?up', 'view (?:this )?in (?:your )?browser', 'unsubscribe', 'digest']
  promo: ['\d+\s?% off', '\bsale\b', 'discount', 'coupon', 'promo code', 'limited[- ]time', 'free shipping', 'special offer', 'exclusive offer', 'offer ends', 'deal of the day', 'flash sale']

builder:
  max_meetings: 3               # meetings listed (imminent first, then later today, then tomorrow)
  max_priority_mail: 5          # priority mail items listed
  min_priority_score: 30        # unread mail below this is "everything else" (a count)
  token_cap: 600                # HARD cap on the context handed to the planner (estimate_tokens)
  subject_chars: 70
  sender_chars: 32
  preview_chars: 90             # snippet shown to the planner (the spoken script never reads it)

speech:
  address_as: "Sir"
  max_words: 85                 # ~25-30 seconds spoken
  morning_until_hour: 12        # "good morning" only triggers the fast path before this local hour

fast_path:
  enabled: true                 # "good morning" / "brief me" answered straight from the cache, no LLM call
  phrases: ["good morning", "morning", "morning briefing", "daily briefing", "brief me", "give me my briefing", "give me my morning briefing", "whats my day look like", "what is my day look like", "what does my day look like"]
